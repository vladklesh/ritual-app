<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ритуал">
<meta name="theme-color" content="#3574bb">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Ритуал</title>
<style>
:root{--bg:#3574bb;--bar:#28578c;--line:rgba(255,255,255,.85);--txt:#fff;--dim:rgba(255,255,255,.7)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
  font-family:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;overflow:hidden;
  -webkit-user-select:none;user-select:none}
#app{height:100%;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) 12px calc(env(safe-area-inset-bottom) + 8px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.big{font-weight:200;line-height:1;text-align:center;letter-spacing:-.02em}
/* бегущий экран */
.clock{font-size:min(36vw,170px);padding:6vh 0 3vh;font-variant-numeric:tabular-nums}
.paused{opacity:.45}
.list{flex:1;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;padding-bottom:6px}
.row{padding:14px 10px;text-align:center;font-size:clamp(20px,5.3vw,26px);line-height:1.2;
  border-bottom:1px solid var(--line)}
.row.cur{background:var(--bar);font-weight:700;border-radius:8px 8px 0 0}
.row.done{opacity:.4}
.foot{display:flex;align-items:center;justify-content:space-between;padding:8px 6px 0}
.foot .cnt{font-size:min(20vw,96px);font-weight:200}
.ic{font-size:34px;padding:10px 18px}
.x{position:absolute;top:calc(env(safe-area-inset-top) + 6px);right:10px;font-size:22px;opacity:.6;padding:8px}
/* меню, редактор, статистика */
.title{font-size:26px;font-weight:600;text-align:center;padding:18px 0 10px}
.btn{display:block;width:100%;padding:16px;margin:8px 0;font-size:20px;font-weight:600;
  background:var(--bar);border-radius:12px;text-align:center}
.btn.go{font-size:34px;padding:26px;background:#fff;color:var(--bg);font-weight:300}
.scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.card{background:var(--bar);border-radius:12px;padding:10px 12px;margin:8px 0}
.card.edit{display:grid;grid-template-columns:1fr auto;gap:6px}
input{width:100%;font:inherit;font-size:18px;color:#fff;background:rgba(255,255,255,.12);border:0;
  border-radius:8px;padding:9px 10px;-webkit-user-select:text;user-select:text}
input::placeholder{color:var(--dim)}
.mini{display:flex;gap:4px;justify-content:flex-end;align-items:center}
.mini button{font-size:20px;padding:6px 10px;background:rgba(255,255,255,.12);border-radius:8px}
.dim{color:var(--dim);font-size:15px;text-align:center;padding:6px 0}
.warn{background:#e0a800;color:#222;border-radius:12px;padding:12px;margin:8px 0;font-weight:600;text-align:center}
.week{display:flex;justify-content:space-between;gap:4px;margin:10px 0}
.week div{flex:1;text-align:center;background:var(--bar);border-radius:10px;padding:8px 0;font-size:13px}
.week b{display:block;font-size:20px;font-weight:600;margin-top:2px}
.tabs{display:flex;justify-content:space-around;border-top:1px solid var(--line);padding-top:6px;margin-top:6px}
.tabs button{font-size:26px;padding:8px 14px;opacity:.55;border-radius:10px}
.tabs button.on{opacity:1;background:var(--bar)}
.item{font-size:clamp(22px,6vw,30px);font-weight:600;text-align:center;padding:26px 8px 12px;line-height:1.25;white-space:pre-line}
.acts{display:flex;gap:10px;justify-content:center;padding:10px 0}
.acts button{flex:1;font-size:34px;padding:16px 0;background:var(--bar);border-radius:14px}
.cd{font-size:56px;font-weight:200;text-align:center;font-variant-numeric:tabular-nums;padding:4px 0}
.sec{font-size:13px;color:var(--dim);padding:14px 4px 4px;letter-spacing:.08em}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;z-index:9}
.sheet>div{background:var(--bg);width:100%;border-radius:18px 18px 0 0;padding:16px 14px calc(env(safe-area-inset-bottom) + 14px)}
.reasons{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.reasons button{font-size:34px;padding:12px 0;background:var(--bar);border-radius:12px}
.reasons small{display:block;font-size:11px;margin-top:2px}
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js?v=3"></script>
<script src="training.js?v=3"></script>
<script src="main.js?v=3"></script>
</body>
</html>
